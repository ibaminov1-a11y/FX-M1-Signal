name: EC1 R3 Rebuild final read-only gate
on:
  push:
    branches: [feature/ec1-r3-rebuild, feature/r4-compute-rebuild]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ec1-r3-rebuild-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin and record exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/COMMIT.txt

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test and packaging dependencies
        run: python -m pip install Flask==3.1.2 colorama==0.4.6

      - name: Python compile and full EventCore regression suite
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q mt5_bridge/event_core tests/event_core
          PYTHONPATH=mt5_bridge:tests/event_core python -m unittest discover -s tests/event_core -p 'test_*.py' -v 2>&1 | tee evidence/python-tests.log

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore persistent EC1 DEMO signing identity
        uses: actions/cache@v4
        with:
          path: ~/.fxm1-signing/ec1-demo.jks
          key: fxm1-ec1-demo-explicit-signing-v1

      - name: Select persistent DEMO signing file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.fxm1-signing"
          key="$HOME/.fxm1-signing/ec1-demo.jks"
          if ! test -s "$key"; then
            keytool -genkeypair -keystore "$key" -storetype PKCS12 -storepass android -keypass android -alias ec1-demo -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=FXM1 EC1 DEMO'
          fi
          chmod 600 "$key"
          echo "EC1_KEYSTORE=$key" >> "$GITHUB_ENV"

      - name: Build APK and instrumentation APK from pinned SHA
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee evidence/android-build.log
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify R3 build identity before runtime
        shell: bash
        run: |
          PYTHONPATH=mt5_bridge python - <<'PY'
          from event_core import VERSION, BUILD, PROTOCOL
          assert VERSION == '10.9-EC1', VERSION
          assert BUILD == '10.9-EC1-R3-REBUILD', BUILD
          assert PROTOCOL == 'fxm1.event.v1', PROTOCOL
          print(VERSION, BUILD, PROTOCOL)
          PY

      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm

      - name: API 35 Android runtime against actual Engine fixture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: bash tools/run_ec1_qa.sh

      - name: Package the exact tested commit
        shell: bash
        run: |
          set -euo pipefail
          python tools/package_ec1.py
          git diff --exit-code
          test -s evidence/FXM1_10_9_EVENT_CORE_DEMO.apk
          test -s evidence/FXM1_10_9_EVENT_CORE_PACKAGE.zip
          test -s evidence/FXM1_EVENT_CORE_SOURCE.zip
          sha256sum evidence/FXM1_10_9_EVENT_CORE_DEMO.apk | tee evidence/APK_SHA256.txt
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path('evidence/package/PROVENANCE.json').read_text(encoding='utf-8'))
          assert p['commit'] == os.environ['GITHUB_SHA'], (p['commit'], os.environ['GITHUB_SHA'])
          assert p['real_trading'] == 'gated_pilot', p
          print('PROVENANCE_OK', p['commit'])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EC1-R3-REBUILD-${{ github.run_number }}-${{ github.sha }}
          path: |
            evidence/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: error
