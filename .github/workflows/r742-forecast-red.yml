name: R742 forecast original RED
on:
  push:
    branches: [repair/r742-forecast-display-20261014]
    paths: [.github/workflows/r742-forecast-red.yml]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: mkdir -p evidence; sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot-save -gpu swiftshader_indirect -camera-back none
          script: set +e; gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.openai.fxm1.R742ForecastContractTest > evidence/red.log 2>&1; echo $? > evidence/gradle-exit.txt
      - name: Require two precise behavioral failures rather than a build error
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as E,json
          from pathlib import Path
          cases=[]
          for p in Path('app/build/outputs/androidTest-results').rglob('*.xml'):cases.extend(E.parse(p).getroot().iter('testcase'))
          assert len(cases)==2, 'Expected two executed native tests'
          text='\n'.join((t.find('failure').text or '') for t in cases if t.find('failure') is not None)
          for marker in ['FORECAST_BUTTON_IS_PATTERNS','ORIGINAL_FORECAST_OVERWRITTEN']: assert marker in text,text
          Path('evidence/RED_RESULT.json').write_text(json.dumps(dict(tests=2,expected_failures=2,product_source='5f6f47f3',release=False)))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R742-ORIGINAL-RED
          path: |
            evidence/
            app/build/outputs/androidTest-results/
          if-no-files-found: error
