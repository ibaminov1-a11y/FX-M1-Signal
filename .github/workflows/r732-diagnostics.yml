name: R732 diagnostic tests only
on:
  push:
    branches: [feature/r732-pattern-chart-20261005]
    paths: ['.github/workflows/r732-diagnostics.yml', 'app/**', 'mt5_bridge/**', 'tests/**', 'tools/**']
permissions:
  contents: read
concurrency:
  group: r732-diagnostics-${{ github.sha }}
  cancel-in-progress: false
env:
  EC1_KEYSTORE: ''
  PYTHONUTF8: '1'
jobs:
  source-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export exact source, no runtime state or signing files
        run: |
          mkdir -p evidence
          git archive --format=zip HEAD > evidence/source.zip
          git ls-tree -r HEAD > evidence/source-tree.txt
          git rev-parse HEAD > evidence/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: R732-SOURCE-${{ github.sha }}
          path: evidence/
      - run: python -m pip install Flask==3.1.2 colorama==0.4.6
      - name: Entire Python regression
        run: |
          PYTHONPATH=mt5_bridge:tests/event_core TERM=xterm python -m unittest discover -s tests/event_core -p 'test_*.py' -v > evidence/python.log 2>&1
          tail -15 evidence/python.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R732-PYTHON-${{ github.sha }}
          path: evidence/python.log
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        source: [current, delivered-red]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Select original source only for the RED reproduction
        if: matrix.source == 'delivered-red'
        run: |
          cp app/src/androidTest/java/com/openai/fxm1/R732ChartStateUiTest.java "$RUNNER_TEMP/R732ChartStateUiTest.java"
          git fetch --depth=1 origin 61bfe8661ee54b98ee1ca6fc191998a2764f47b1
          git checkout 61bfe8661ee54b98ee1ca6fc191998a2764f47b1 -- app/src/main app/src/androidTest app/build.gradle
          cp "$RUNNER_TEMP/R732ChartStateUiTest.java" app/src/androidTest/java/com/openai/fxm1/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Flask==3.1.2 colorama==0.4.6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare isolated diagnostic runner
        env:
          CHECK_MODE: ${{ matrix.source }}
        run: |
          mkdir -p evidence/ui
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sudo chmod 666 /dev/kvm
          cat > "$RUNNER_TEMP/r732-native.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          PYTHONPATH=mt5_bridge:tests/event_core python tests/event_core/ui_fixture.py > evidence/fixture.log 2>&1 &
          fixture=$!
          trap 'kill "$fixture" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS -H 'Authorization: Bearer ci-fixture-token-not-for-real-trading' http://127.0.0.1:8765/health >/dev/null; then break; fi
            sleep 1
          done
          adb reverse tcp:8765 tcp:8765
          if test "$CHECK_MODE" = delivered-red; then
            classes=com.openai.fxm1.R732ChartStateUiTest
          else
            classes=$(python -c "from pathlib import Path; print(','.join('com.openai.fxm1.'+p.stem for p in sorted(Path('app/src/androidTest/java/com/openai/fxm1').glob('*Test.java')) if p.stem!='V108RepairTest'))")
          fi
          set +e
          gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class="$classes" > evidence/android.log 2>&1
          rc=$?
          set -e
          echo "$rc" > evidence/gradle-exit.txt
          timeout 15s adb logcat -d > evidence/logcat.txt 2>&1 || true
          adb pull /sdcard/Download/ec1-qa evidence/ui > evidence/png-export.log 2>&1 || true
          test ! -d app/build/outputs/androidTest-results || cp -r app/build/outputs/androidTest-results evidence/
          tail -55 evidence/android.log
          if test "$CHECK_MODE" = delivered-red; then
            python - "$rc" <<'PY'
          from pathlib import Path
          import sys, json, xml.etree.ElementTree as E
          cases=[]
          for p in Path('evidence/androidTest-results').rglob('*.xml'):
              cases.extend(E.parse(p).getroot().iter('testcase'))
          assert len(cases)==1, 'Expected one executed native reproduction'
          failure=cases[0].find('failure')
          assert int(sys.argv[1])!=0 and failure is not None, 'Expected old-source failure'
          assert 'SERVER_FALSE_OVERRIDDEN' in E.tostring(failure, encoding='unicode'), 'Wrong failure cause'
          Path('evidence/RED_RESULT.json').write_text(json.dumps({'source':'61bfe8661ee54b98ee1ca6fc191998a2764f47b1','expected_failure':'SERVER_FALSE_OVERRIDDEN','native_test_executed':True},indent=2))
          print('ORIGINAL_GRAPH_DEFECT_REPRODUCED')
          PY
          else
            exit "$rc"
          fi
          SH
          echo "CHECK_MODE=$CHECK_MODE" >> "$GITHUB_ENV"
      - name: Android API35, temporary diagnostic certificate only
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot-save -gpu swiftshader_indirect -camera-back none
          script: bash "$RUNNER_TEMP/r732-native.sh"
      - name: Retain diagnostic evidence only; no installation APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R732-ANDROID-${{ matrix.source }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
