name: R732 diagnostic tests only
on:
  push:
    branches: [feature/r732-pattern-chart-20261005]
    paths: ['.github/workflows/r732-diagnostics.yml', '.ci/r732-run.txt']
permissions:
  contents: read
concurrency:
  group: r732-diagnostics-${{ github.sha }}
  cancel-in-progress: false
env:
  EC1_KEYSTORE: ''
  PYTHONUTF8: '1'
jobs:
  source-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export exact tracked source
        run: |
          mkdir -p evidence
          git archive --format=zip HEAD > evidence/source.zip
          git ls-tree -r HEAD > evidence/source-tree.txt
          git rev-parse HEAD > evidence/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: R732-SOURCE-${{ github.sha }}
          path: evidence/
      - run: python -m pip install Flask==3.1.2 colorama==0.4.6
      - name: Entire Python regression
        run: |
          PYTHONPATH=mt5_bridge:tests/event_core TERM=xterm python -m unittest discover -s tests/event_core -p 'test_*.py' -v > evidence/python.log 2>&1
          tail -15 evidence/python.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R732-PYTHON-${{ github.sha }}
          path: evidence/python.log
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Flask==3.1.2 colorama==0.4.6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate numeric catalogs for native integration tests
        run: PYTHONPATH=mt5_bridge:tests/event_core python tests/event_core/export_r732_chart_fixtures.py
      - name: Prepare diagnostic runner, no production signing access
        run: |
          mkdir -p evidence/ui
          git rev-parse HEAD > evidence/SOURCE_COMMIT.txt
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sudo chmod 666 /dev/kvm
          cat > "$RUNNER_TEMP/r732-native.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          PYTHONPATH=mt5_bridge:tests/event_core python tests/event_core/ui_fixture.py > evidence/fixture.log 2>&1 &
          fixture=$!
          trap 'kill "$fixture" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS -H 'Authorization: Bearer ci-fixture-token-not-for-real-trading' http://127.0.0.1:8765/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS -H 'Authorization: Bearer ci-fixture-token-not-for-real-trading' http://127.0.0.1:8765/health >/dev/null
          adb reverse tcp:8765 tcp:8765
          classes=$(python - <<'PY'
          from pathlib import Path
          flag=Path('.ci/r732-run.txt')
          mode=flag.read_text().strip().splitlines()[0] if flag.exists() else 'FOCUS'
          tests=sorted(Path('app/src/androidTest/java/com/openai/fxm1').glob('*Test.java'))
          if mode!='FULL':tests=[p for p in tests if p.stem.startswith('R732')]
          print(','.join('com.openai.fxm1.'+p.stem for p in tests if p.stem!='V108RepairTest'))
          PY
          )
          test -n "$classes"
          set +e
          gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class="$classes" > evidence/android.log 2>&1
          rc=$?
          set -e
          echo "$rc" > evidence/gradle-exit.txt
          timeout 15s adb logcat -d > evidence/logcat.txt 2>&1 || true
          adb pull /sdcard/Download/ec1-qa evidence/ui > evidence/png-export.log 2>&1 || true
          test ! -d app/build/outputs/androidTest-results || cp -r app/build/outputs/androidTest-results evidence/
          tail -65 evidence/android.log
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E,json,hashlib,subprocess
          cases=[]
          for p in Path('evidence/androidTest-results').rglob('*.xml'):cases.extend(E.parse(p).getroot().iter('testcase'))
          rows=[{'class':t.get('classname'),'test':t.get('name'),'status':'FAIL' if t.find('failure') is not None or t.find('error') is not None else 'SKIP' if t.find('skipped') is not None else 'PASS'} for t in cases]
          result={'source_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'diagnostic_only':True,'production_signature_verified':False,'tests':rows,'count':len(rows)}
          apk=Path('app/build/outputs/apk/debug/app-debug.apk')
          if apk.is_file():result['diagnostic_apk_sha256']=hashlib.sha256(apk.read_bytes()).hexdigest()
          Path('evidence/NATIVE_RESULT.json').write_text(json.dumps(result,indent=2))
          assert cases,'No executed native tests'
          PY
          exit "$rc"
          SH
      - name: Android API35 with temporary diagnostic certificate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot-save -gpu swiftshader_indirect -camera-back none
          script: bash "$RUNNER_TEMP/r732-native.sh"
      - name: Retain evidence only, never an installation APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R732-ANDROID-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
