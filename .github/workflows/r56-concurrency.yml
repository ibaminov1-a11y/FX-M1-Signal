name: R56 concurrency regression gate
on:
  push:
    branches: [feature/r56-races]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r56-concurrency-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Flask==3.1.2 colorama==0.4.6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: bash tools/audit56_concurrency.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R56-CONCURRENCY-${{ github.sha }}
          path: evidence/concurrency/
          if-no-files-found: error
