name: R7 source export
on:
  push:
    branches: [feature/r4-compute-rebuild]
    paths: ['.github/workflows/r7-source-export.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          mkdir -p export
          git rev-parse HEAD > export/COMMIT.txt
          git archive --format=zip -o export/source.zip HEAD
          sha256sum export/source.zip > export/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: R7-SOURCE-${{ github.sha }}
          path: export/
          if-no-files-found: error
