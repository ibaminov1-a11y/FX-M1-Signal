name: R7.3.1 signed Scenario Map candidate
on:
  push:
    branches: [feature/r4-compute-rebuild]
    paths: ['.github/workflows/r731-signed-pr.yml']
permissions:
  contents: read
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a634afc3900acafe93048b621ed2a25a55c38c0b
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/cache/restore@v4
        with:
          path: ~/.fxm1-signing/ec1-demo.jks
          key: fxm1-ec1-demo-explicit-signing-v1
          fail-on-cache-miss: true
      - name: Build exact signed APK
        run: |
          export EC1_KEYSTORE="$HOME/.fxm1-signing/ec1-demo.jks"
          gradle --no-daemon --stacktrace :app:assembleDebug
          mkdir -p evidence
          cp app/build/outputs/apk/debug/app-debug.apk evidence/FXM1_R7_3_1_SCENARIO_MAP.apk
          git rev-parse HEAD > evidence/COMMIT.txt
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --print-certs evidence/FXM1_R7_3_1_SCENARIO_MAP.apk > evidence/apk-signature.txt
          grep -q '3d55a491046e661664f99c2a3e4a51338a794b313beb3e32d7ed88181a7a1885' evidence/apk-signature.txt
          sha256sum evidence/FXM1_R7_3_1_SCENARIO_MAP.apk > evidence/APK_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: R731-SIGNED-a634afc3900acafe93048b621ed2a25a55c38c0b
          path: evidence/
          if-no-files-found: error
