name: R7.3.1 graph defect gate
on:
  push:
    branches: [feature/r4-compute-rebuild]
    paths: ['.github/workflows/r731-graph-gate.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 641fee69705d32220cddaef954e890fd606c6c49
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Flask==3.1.2 colorama==0.4.6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Native API35 defect gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot-save -gpu swiftshader_indirect -camera-back none
          script: |
            set -euo pipefail
            PYTHONPATH=mt5_bridge:tests/event_core python tests/event_core/ui_fixture.py > /tmp/r731-fixture.log 2>&1 &
            trap 'kill $! 2>/dev/null || true' EXIT
            for i in $(seq 1 30); do
              curl -fsS -H 'Authorization: Bearer ci-fixture-token-not-for-real-trading' http://127.0.0.1:8765/health >/dev/null && break
              sleep 1
            done
            adb reverse tcp:8765 tcp:8765
            gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class='com.openai.fxm1.R73ChartUiTest#newChartDefaultsToScenarioMapInsteadOfAnalogForecast,com.openai.fxm1.R73ChartUiTest#waitCannotDrawAnalogFutureEvenWhenAnalogWasRequested'
