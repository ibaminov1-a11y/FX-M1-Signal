# R5.7 release workflow is archived: its immutable baseline remains in commit 4bc02488.
# R7 must use its own exact-source release gate, not publish an old R5.7 artifact.
name: Archived R5.7 release pointer
on: workflow_dispatch
permissions:
  contents: read
jobs:
  archived:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'R5.7 is archived at 4bc02488. No installable package is built from R7 work-in-progress.'
