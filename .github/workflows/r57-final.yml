name: R5.7 exact-source signed release gate
on:
  push:
    branches: [feature/r4-compute-rebuild]
    paths:
      - '.github/workflows/r57-final.yml'
      - 'app/build.gradle'
      - 'mt5_bridge/event_core/__init__.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r57-final-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-package:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin exact immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/COMMIT.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test and portable packaging dependencies
        run: python -m pip install Flask==3.1.2 colorama==0.4.6
      - name: Prove first entry and additions failed on the delivered R5.6 Engine
        run: python tools/audit57_red_python.py
      - name: Compile Python and execute full EventCore suite
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q mt5_bridge/event_core tests/event_core tools/package_ec1.py tools/audit57_report.py
          PYTHONPATH=mt5_bridge:tests/event_core python -m unittest discover -s tests/event_core -p 'test_*.py' -v 2>&1 | tee evidence/python-tests.log
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore original branch-scoped EC1 signing identity
        uses: actions/cache/restore@v4
        with:
          path: ~/.fxm1-signing/ec1-demo.jks
          key: fxm1-ec1-demo-explicit-signing-v1
          fail-on-cache-miss: true
      - name: Require original certificate before compiling
        shell: bash
        run: |
          set -euo pipefail
          signing_file="$HOME/.fxm1-signing/ec1-demo.jks"
          test -s "$signing_file"
          chmod 600 "$signing_file"
          keytool -exportcert -alias ec1-demo -keystore "$signing_file" -storepass android -file "$RUNNER_TEMP/ec1-r57-cert.der"
          test "$(sha256sum "$RUNNER_TEMP/ec1-r57-cert.der" | cut -d' ' -f1)" = '3d55a491046e661664f99c2a3e4a51338a794b313beb3e32d7ed88181a7a1885'
          sha256sum "$RUNNER_TEMP/ec1-r57-cert.der" > evidence/signing-certificate-sha256.txt
          echo "EC1_KEYSTORE=$signing_file" >> "$GITHUB_ENV"
      - name: Compile APK and all native test sources
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee evidence/android-build.log
          test -s app/build/outputs/apk/debug/app-debug.apk
          PYTHONPATH=mt5_bridge python - <<'PY'
          from event_core import VERSION, BUILD, PROTOCOL
          assert (VERSION, BUILD, PROTOCOL) == ('10.9-EC1', '10.9-EC1-R5.7', 'fxm1.event.v1')
          print(VERSION, BUILD, PROTOCOL)
          PY
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: API35 baseline RED and full current EC1 native regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot-save -gpu swiftshader_indirect -camera-back none
          script: bash tools/run_ec1_qa.sh
      - name: Package verified matching APK and Bridge from this SHA
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD
          python tools/package_ec1.py
          test -s evidence/FXM1_R5_7_FULL.zip
          python - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          e = Path('evidence')
          p = json.loads((e/'package/PROVENANCE.json').read_text())
          assert p['commit'] == os.environ['GITHUB_SHA'], p['commit']
          assert p['build'] == '10.9-EC1-R5.7' and p['version_code'] == 926
          assert p['real_trading'] == 'disabled_in_adapter'
          assert (e/'FXM1_R5_7_FULL.zip').stat().st_size < 32*1024*1024
          with zipfile.ZipFile(e/'FXM1_R5_7_FULL.zip') as z:
              assert z.testzip() is None
              assert hashlib.sha256(z.read('FXM1_10_9_EVENT_CORE_DEMO.apk')).hexdigest() == p['apk_sha256']
              assert hashlib.sha256(z.read('Sources/FXM1_R5_7_SOURCE.zip')).hexdigest() == p['source_sha256']
              assert hashlib.sha256(z.read('INSTALL_BRIDGE_R57.cmd')).hexdigest() == p['installer_sha256']
              for name, digest in p['bridge_files_sha256'].items():
                  assert hashlib.sha256(z.read('Bridge/'+name)).hexdigest() == digest, name
          print('R57_DELIVERY_VERIFIED', p['commit'])
          PY
      - name: Retain complete verification evidence and native screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FXM1-R57-VERIFICATION-${{ github.run_number }}-${{ github.sha }}
          path: |
            evidence/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: error
      - name: Deliver only the self-contained installation ZIP
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: FXM1-R57-DELIVERY-${{ github.sha }}
          path: evidence/FXM1_R5_7_FULL.zip
          compression-level: 0
          if-no-files-found: error
