name: R74 forecast original RED
on:
  push:
    branches: [fix/r74-forecast-view-20261013]
    paths: [.github/workflows/r74-forecast-red.yml]
permissions:
  contents: read
jobs:
  native-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: mkdir -p evidence; sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot-save -gpu swiftshader_indirect -camera-back none
          script: |
            set +e; gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.openai.fxm1.R74ForecastRegressionTest > evidence/red.log 2>&1; echo $? > evidence/EXIT.txt
      - name: Require the three behavioural defects, not a compilation failure
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as E,json
          from pathlib import Path
          cases=[]
          for p in Path('app/build/outputs/androidTest-results').rglob('*.xml'):
              cases.extend(E.parse(p).getroot().iter('testcase'))
          assert len(cases)==3, len(cases)
          failures=[t for t in cases if t.find('failure') is not None]
          assert len(failures)==3
          text='\n'.join(t.find('failure').text or '' for t in failures)
          for marker in ['FORECAST_BUTTON_IS_STILL_PATTERNS','EXPLICIT_FORECAST_IS_HIDDEN','ISSUED_FORECAST_WAS_REWRITTEN']:
              assert marker in text,text
          Path('evidence/RED.json').write_text(json.dumps({'tests':3,'expected_failures':3,'no_product_fix_yet':True}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R74-FORECAST-ORIGINAL-RED
          path: |
            evidence/
            app/build/outputs/androidTest-results/
