name: R742 final source corrections
on:
  push:
    branches: [repair/r742-forecast-display-20261014]
    paths: [.github/workflows/r742-finish-source.yml]
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fix test compilation only; application source is unchanged
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/androidTest/java/com/openai/fxm1/R56TimeframesUiTest.java')
          s=p.read_text();assert 'Native screenshot must exist' in s
          assert s.count('import java.io.InputStream;')==1
          assert 'import java.io.FileOutputStream;' not in s
          p.write_text(s.replace('import java.io.InputStream;', 'import java.io.InputStream;\nimport java.io.File;\nimport java.io.FileOutputStream;'))
          PY
          git diff --check
          git add app/src/androidTest/java/com/openai/fxm1/R56TimeframesUiTest.java
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(chart): import native screenshot output types'
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:"$GITHUB_REF"
          mkdir -p evidence
          git diff HEAD~1 HEAD > evidence/CORRECTIONS.patch
          git rev-parse HEAD > evidence/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R742-FINAL-CORRECTIONS
          path: evidence/
