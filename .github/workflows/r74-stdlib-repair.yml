name: R74 standard library recovery
on:
  push:
    branches: [repair/r74-stdlib-recovery-20261013]
    paths: ['tools/r74_stdlib_repair/**', '.github/workflows/r74-stdlib-repair.yml']
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      R7_NO_PAUSE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - uses: actions/download-artifact@v4
        with:
          name: R74-COMPLETE-PROJECT
          run-id: 38370853951
          github-token: ${{ github.token }}
          path: original
      - name: Reproduce reported abc failure with original shipped CMD
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          python tools/r74_stdlib_repair/verify_windows.py red original/FXM1_R74_COMPLETE_PROJECT.zip *> evidence/RED.log
          $rc=$LASTEXITCODE
          if ($rc -ne 1) { Get-Content evidence/RED.log; throw 'Expected original regression not reproduced' }
          if (-not (Select-String -Path evidence/RED.log -SimpleMatch 'ABC_MISSING_NOT_RECOVERED')) { Get-Content evidence/RED.log; throw 'Wrong RED failure' }
          exit 0
      - name: Build full project preserving all trading modules and original APK
        shell: pwsh
        run: |
          python tools/r74_stdlib_repair/build.py original/FXM1_R74_COMPLETE_PROJECT.zip dist *> evidence/BUILD.json
          if ($LASTEXITCODE -ne 0) { Get-Content evidence/BUILD.json; exit 1 }
      - name: Validate real START.cmd with missing and corrupt libraries
        shell: pwsh
        run: |
          python tools/r74_stdlib_repair/verify_windows.py green dist/FXM1_R74_COMPLETE_PROJECT_FIXED.zip *> evidence/GREEN.log
          $rc=$LASTEXITCODE
          Get-Content evidence/GREEN.log -Tail 25
          exit $rc
      - name: Original complete Python regression with shipped dependencies
        shell: pwsh
        run: |
          $env:PYTHONPATH='dist/FX-M1-Signal/mt5_bridge;dist/FX-M1-Signal/Runtime/Lib/site-packages;tests/event_core'
          $env:TERM='xterm'
          python -m unittest discover -s tests/event_core -p 'test_*.py' -v *> evidence/PYTHON.log
          $rc=$LASTEXITCODE
          Get-Content evidence/PYTHON.log -Tail 25
          exit $rc
      - name: Record exact artifact identity and packaging source
        shell: pwsh
        run: |
          git archive --format=zip --output=evidence/PACKAGING_SOURCE.zip HEAD
          git rev-parse HEAD > evidence/SOURCE_COMMIT.txt
          (Get-FileHash dist/FXM1_R74_COMPLETE_PROJECT_FIXED.zip -Algorithm SHA256).Hash > evidence/ARCHIVE_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: R74-FULL-PROJECT-LIBRARY-FIX
          path: dist/FXM1_R74_COMPLETE_PROJECT_FIXED.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R74-LIBRARY-FIX-CHECKS
          path: evidence/
          if-no-files-found: error
