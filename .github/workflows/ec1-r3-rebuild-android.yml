name: EC1 R3 Rebuild Android TDD
on:
  push:
    branches: [feature/ec1-r3-rebuild, feature/r4-compute-rebuild]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ec1-r3-rebuild-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile app and instrumentation tests
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

  runtime:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixture dependencies
        run: python -m pip install Flask==3.1.2 colorama==0.4.6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Run R3 Android runtime suite against actual Engine fixture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: bash tools/run_ec1_qa.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r3-android-runtime-${{ github.run_number }}
          path: |
            evidence/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
