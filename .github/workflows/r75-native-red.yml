name: R75 native chart baseline RED
on:
  push:
    branches: [feature/r75-pinned-campaign-20261007]
    paths: [.github/workflows/r75-native-red.yml]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Flask==3.1.2 colorama==0.4.6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: |
          mkdir -p evidence
          PYTHONPATH=mt5_bridge:tests/event_core python tests/event_core/export_r732_chart_fixtures.py
          cp app/src/androidTest/java/com/openai/fxm1/R75ChartContractUiTest.java evidence/
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot-save -gpu swiftshader_indirect -camera-back none
          script: |
            set +e; gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.openai.fxm1.R75ChartContractUiTest > evidence/red.log 2>&1; echo $? > evidence/gradle-exit.txt
      - name: Assert the three expected defects, not a failed compilation
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as E,json
          from pathlib import Path
          cases=[]
          for p in Path('app/build/outputs/androidTest-results').rglob('*.xml'):cases.extend(E.parse(p).getroot().iter('testcase'))
          assert len(cases)==4,len(cases)
          failed=[t for t in cases if t.find('failure') is not None]
          text='\n'.join(t.find('failure').text or '' for t in failed)
          for marker in ['SCROLL_REPARSES_UNCHANGED_FORECAST','DISPLAY_REPLACED_PINNED_ROOT','ALTERNATIVE_ROLE_NOT_EXPLICIT']:assert marker in text,text
          assert len(failed)==3
          Path('evidence/RED_RESULT.json').write_text(json.dumps(dict(tests=4,expected_failures=3,release=False)))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R75-NATIVE-BASELINE-RED
          path: |
            evidence/
            app/build/outputs/androidTest-results/
