name: R7 source milestone and native verification
on:
  push:
    branches: [feature/r4-compute-rebuild]
    paths: ['tools/r7_stage/**', '.github/workflows/r7-milestone.yml', 'tools/run_r7_native.sh']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r7-milestone-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: source
        name: Commit verified source bytes before testing
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feature/r4-compute-rebuild'
          if test -f tools/r7_stage/materialize.py; then
            python tools/r7_stage/materialize.py
            python - <<'PY'
          import importlib.util, subprocess
          p='tools/r7_stage/materialize.py'
          spec=importlib.util.spec_from_file_location('transport',p)
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          subprocess.run(['git','add','--']+m.FILES,check=True)
          PY
            git rm -r -- tools/r7_stage
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m '[R7-WIP] Integrate HF2 and independent forecast source after RED proof; not a release'
            current=$(git ls-remote origin "$GITHUB_REF" | cut -f1)
            test "$current" = "$GITHUB_SHA"
            git push origin HEAD:"$GITHUB_REF"
          fi
          test -z "$(git status --porcelain)"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin immutable actual source
        env:
          EXPECTED_SHA: ${{ needs.source.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p evidence
          git rev-parse HEAD > evidence/COMMIT.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Flask==3.1.2 colorama==0.4.6
      - name: Full Python source suite
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q mt5_bridge/event_core tests/event_core
          PYTHONPATH=mt5_bridge:tests/event_core TERM=xterm python -m unittest discover -s tests/event_core -p 'test_*.py' -v 2>&1 | tee evidence/python-tests.log
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/cache/restore@v4
        with:
          path: ~/.fxm1-signing/ec1-demo.jks
          key: fxm1-ec1-demo-explicit-signing-v1
          fail-on-cache-miss: true
      - name: Require original certificate and server SDK
        run: |
          keytool -exportcert -alias ec1-demo -keystore "$HOME/.fxm1-signing/ec1-demo.jks" -storepass android -file "$RUNNER_TEMP/r7-cert.der"
          test "$(sha256sum "$RUNNER_TEMP/r7-cert.der" | cut -d' ' -f1)" = '3d55a491046e661664f99c2a3e4a51338a794b313beb3e32d7ed88181a7a1885'
          echo "EC1_KEYSTORE=$HOME/.fxm1-signing/ec1-demo.jks" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sudo chmod 666 /dev/kvm
      - name: API35 actual GREEN and existing native regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot-save -gpu swiftshader_indirect -camera-back none
          script: bash tools/run_r7_native.sh
      - name: Verify no uncommitted build transformations
        run: git diff --exit-code HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R7-MILESTONE-NOT-RELEASE-${{ needs.source.outputs.sha }}
          path: |
            evidence/
            app/build/outputs/androidTest-results/
          if-no-files-found: error
