name: R56 chart semantic regression reproduction
on:
  push:
    branches: [feature/r56-red]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chart-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.openai.fxm1.R56ChartSemanticsTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R56-RED-${{ github.sha }}
          path: app/build/outputs/androidTest-results/
