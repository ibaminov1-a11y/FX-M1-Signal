name: R74 one folder native acceptance
on:
  push:
    branches: [repair/r74-one-folder-20261013]
    paths: ['tools/r74_simple/**', '.github/workflows/r74-one-folder.yml']
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      R7_NO_PAUSE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - uses: actions/download-artifact@v4
        with:
          name: R74-COMPLETE-RESTORE
          run-id: 38356652559
          github-token: ${{ github.token }}
          path: original
      - name: Require reported packaging defect before change
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          git rev-parse HEAD > evidence/SOURCE_COMMIT.txt
          python tools/r74_simple/check_layout.py original/FXM1_R7_4_RESTORE_FULL.zip *> evidence/LAYOUT_RED.json
          if ($LASTEXITCODE -ne 1) { throw 'Original defect not reproduced' }
          $r=Get-Content evidence/LAYOUT_RED.json -Raw | ConvertFrom-Json
          if ($r.no_nested_archives -or $r.one_start_command -or $r.ok) { throw 'Wrong RED result' }
          exit 0
      - name: Build one-folder bundle without changing trading code
        shell: pwsh
        run: |
          python tools/r74_simple/build.py original/FXM1_R7_4_RESTORE_FULL.zip dist *> evidence/BUILD_RESULT.json
          if ($LASTEXITCODE -ne 0) { Get-Content evidence/BUILD_RESULT.json; exit 1 }
          python tools/r74_simple/check_layout.py dist/FXM1_R74_ONE_FOLDER.zip *> evidence/LAYOUT_GREEN.json
          exit $LASTEXITCODE
      - name: Exercise actual shipped CMD and embedded Python on Windows
        shell: pwsh
        run: |
          python tools/r74_simple/verify_windows.py *> evidence/NATIVE.log
          $rc=$LASTEXITCODE
          Get-Content evidence/NATIVE.log -Tail 30
          exit $rc
      - name: Entire original Python suite with packaged dependencies
        shell: pwsh
        run: |
          $env:PYTHONPATH='dist/FXM1_R74_READY/system/mt5_bridge;dist/FXM1_R74_READY/system/Runtime/Lib/site-packages;tests/event_core'
          $env:TERM='xterm'
          python -m unittest discover -s tests/event_core -p 'test_*.py' -v *> evidence/PYTHON.log
          $rc=$LASTEXITCODE
          Get-Content evidence/PYTHON.log -Tail 25
          exit $rc
      - name: Retain exact source and archive identity
        shell: pwsh
        run: |
          git archive --format=zip --output=evidence/SOURCE.zip HEAD
          (Get-FileHash dist/FXM1_R74_ONE_FOLDER.zip -Algorithm SHA256).Hash > evidence/ARCHIVE_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: R74-ONE-FOLDER
          path: dist/FXM1_R74_ONE_FOLDER.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R74-ONE-FOLDER-CHECKS
          path: evidence/
          if-no-files-found: error
