name: EC1 R3 Rebuild Python TDD
on:
  push:
    branches: [feature/ec1-r3-rebuild]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ec1-r3-rebuild-python-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Flask==3.1.2 colorama==0.4.6
      - name: EventCore tests
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q mt5_bridge/event_core tests/event_core
          PYTHONPATH=mt5_bridge:tests/event_core python -m unittest discover -s tests/event_core -p 'test_*.py' -v
