name: R7.3 reproduce Android failures on unchanged R7.2
on:
  push:
    branches: [qa/r73-red-20261005]
permissions:
  contents: read
jobs:
  android-red:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Flask==3.1.2 colorama==0.4.6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: |
          mkdir -p evidence
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot-save -gpu swiftshader_indirect -camera-back none
          script: |
            PYTHONPATH=mt5_bridge:tests/event_core python tests/event_core/ui_fixture.py > evidence/ui-fixture.log 2>&1 &
            for i in $(seq 1 30); do curl -fsS -H 'Authorization: Bearer ci-fixture-token-not-for-real-trading' http://127.0.0.1:8765/health >/dev/null && break; sleep 1; done
            adb reverse tcp:8765 tcp:8765
            gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.openai.fxm1.R73ControlsUiTest,com.openai.fxm1.R73ChartUiTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R73-RED-native
          path: |
            evidence/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
