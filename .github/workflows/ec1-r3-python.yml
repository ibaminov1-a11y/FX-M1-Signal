name: EC1 R3 Python TDD
on:
  push:
    branches: [feature/ec1-r3-adaptive-entry]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: ec1-r3-python-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize reviewed R3 patch
        shell: bash
        run: |
          if test -f tools/r3_patch/apply.py; then
            python tools/r3_patch/apply.py
            rm -rf tools/r3_patch
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add mt5_bridge tests tools app docs .github
            git diff --cached --check
            git commit -m 'R3: materialize reviewed TDD patch'
            git push origin HEAD:feature/ec1-r3-adaptive-entry
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Flask==3.1.2 colorama==0.4.6
      - name: EventCore tests
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q mt5_bridge/event_core tests/event_core
          PYTHONPATH=mt5_bridge:tests/event_core python -m unittest discover -s tests/event_core -p 'test_*.py' -v
