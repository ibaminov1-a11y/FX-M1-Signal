name: QA V10 review 2026-09-10

on:
  push:
    branches:
      - qa/v10-review-20260910

permissions:
  contents: write

jobs:
  qa-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply only agreed fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  print('ALREADY PATCHED:', label)
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('PATCHED:', label)

          svc = 'app/src/main/java/com/openai/fxm1/MonitoringService.java'
          bridge = 'mt5_bridge/bridge_v10_0.py'

          replace_once(
              svc,
              '.putBoolean("auto_trading", false)\n                .putBoolean("trading_paused", false)\n                .putBoolean("stop_all_requested", true)\n                .putString("bg_status", "EMERGENCY STOP · CLOSE ALL")',
              '.putBoolean("auto_user_enabled", false)\n                .putBoolean("auto_trading", false)\n                .putBoolean("trading_paused", false)\n                .putBoolean("stop_all_requested", true)\n                .putString("bg_status", "EMERGENCY STOP · CLOSE ALL")',
              'Emergency clears persisted AUTO permission')

          replace_once(
              svc,
              'p.edit().putString("stats_snapshot", FeatureEngine.formatStats(st))\n                        .putString("risk_snapshot",',
              'p.edit().putString("risk_stats_snapshot", FeatureEngine.formatStats(st))\n                        .putString("risk_snapshot",',
              'Risk stats cannot overwrite money ledger stats')

          replace_once(
              svc,
              'String line = currentSymbol() + " · " + currentTf() + " · " + currentMode() + " · " + signal +\n                (quality >= 0 ? " · " + quality + "/100" : "");\n\n        Notification.Builder b = new Notification.Builder(this, CHANNEL_MONITOR)',
              'String line = currentSymbol() + " · " + currentTf() + " · " + currentMode() + " · " + signal +\n                (quality >= 0 ? " · " + quality + "/100" : "");\n\n        boolean confirmingEmergency = text != null && text.startsWith("EMERGENCY:");\n        String visibleLine = confirmingEmergency ? text : line;\n        String expandedLine = text == null || text.trim().isEmpty() ? line : line + "\\n" + text;\n\n        Notification.Builder b = new Notification.Builder(this, CHANNEL_MONITOR)',
              'Emergency confirmation text is visible')

          replace_once(
              svc,
              '.setContentText(line)\n                .setContentIntent(openAppIntent())\n                .addAction(new Notification.Action.Builder(R.drawable.ic_stat_fx, "PLAY", playPi).build())\n                .addAction(new Notification.Action.Builder(R.drawable.ic_stat_fx, "PAUSE", pausePi).build())\n                .addAction(new Notification.Action.Builder(R.drawable.ic_stat_fx, "EMERGENCY STOP", emergencyPi).build());',
              '.setContentText(visibleLine)\n                .setStyle(new Notification.BigTextStyle().bigText(expandedLine))\n                .setContentIntent(openAppIntent())\n                .addAction(new Notification.Action.Builder(android.R.drawable.ic_media_play, "PLAY", playPi).build())\n                .addAction(new Notification.Action.Builder(android.R.drawable.ic_media_pause, "PAUSE", pausePi).build())\n                .addAction(new Notification.Action.Builder(android.R.drawable.ic_delete, "EMERGENCY STOP", emergencyPi).build());',
              'PLAY PAUSE EMERGENCY actions use distinct native icons')

          replace_once(
              bridge,
              'deals = mt5.history_deals_get(start, now) or []\n    return deals',
              'deals = mt5.history_deals_get(start, now)\n    if deals is None:\n        raise RuntimeError(f"history_deals_get failed: {mt5.last_error()}")\n    return deals',
              'MT5 history API error cannot become false zero history')

          replace_once(
              bridge,
              "ok, result = close_position_internal(p)\n            return jsonify(ok=ok, message=result.get('message','close'), **result), (200 if ok else 500)",
              "ok, result = close_position_internal(p)\n            response = dict(result)\n            response.setdefault('message', 'close')\n            response.update(ok=bool(ok), bridge_version=BRIDGE_VERSION)\n            return jsonify(response), (200 if ok else 500)",
              'Close response contains one message field')

          replace_once(
              bridge,
              "ok, result = close_position_internal(p, volume=float(p.volume)*pct/100.0, comment=f'FXM1 V{BRIDGE_VERSION} PARTIAL')\n            return jsonify(ok=ok, message=result.get('message','partial'), **result), (200 if ok else 500)",
              "ok, result = close_position_internal(p, volume=float(p.volume)*pct/100.0, comment=f'FXM1 V{BRIDGE_VERSION} PARTIAL')\n            response = dict(result)\n            response.setdefault('message', 'partial')\n            response.update(ok=bool(ok), bridge_version=BRIDGE_VERSION)\n            return jsonify(response), (200 if ok else 500)",
              'Partial response contains one message field')
          PY

      - name: Verify scope and invariants
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          import subprocess
          from pathlib import Path
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).split())
          allowed = {
            'app/src/main/java/com/openai/fxm1/MonitoringService.java',
            'mt5_bridge/bridge_v10_0.py'
          }
          if not changed.issubset(allowed):
              raise SystemExit('Unexpected changed files: ' + repr(sorted(changed-allowed)))

          main = Path('app/src/main/java/com/openai/fxm1/MainActivity.java').read_text(encoding='utf-8')
          svc = Path('app/src/main/java/com/openai/fxm1/MonitoringService.java').read_text(encoding='utf-8')
          feature = Path('app/src/main/java/com/openai/fxm1/FeatureEngine.java').read_text(encoding='utf-8')
          xml = Path('app/src/main/res/layout/activity_main.xml').read_text(encoding='utf-8')
          bridge = Path('mt5_bridge/bridge_v10_0.py').read_text(encoding='utf-8')

          # Required UI already exists in current main: do not duplicate it.
          assert 'android:id="@+id/moneyHistoryButton"' in xml
          assert 'ДЕНЬГИ / ИСТОРИЯ' in xml
          assert 'Сегодня: —' in xml and 'Всего: —' in xml
          assert 'formatRealizedMoneySummary' in feature
          assert 'formatFullTradeHistory' in feature
          assert 'refreshStatsAndPositions();' in main
          assert 'base+"/position-action"' in main and 'refreshStatsAndPositions();' in main

          # Preserve agreed trading mode and safety.
          assert '.putString("target_trade_mode", "DEMO")' in feature
          assert 'BE: OFF · Trailing: OFF · EXIT: SWING/PEAK' in feature
          assert 'o.put("scalp_mode", false);' in feature
          assert 'NORMAL runtime: ACTIVE · SCALP supervisor DISABLED' in bridge
          assert 'FXM1_ALLOW_REAL", "0"' in bridge

          # Required fixes.
          assert 'history_deals_get failed:' in bridge
          assert "response.setdefault('message', 'close')" in bridge
          assert "response.setdefault('message', 'partial')" in bridge
          assert '.putBoolean("auto_user_enabled", false)' in svc
          assert '.putString("risk_stats_snapshot", FeatureEngine.formatStats(st))' in svc
          assert 'setContentText(visibleLine)' in svc
          assert '"PLAY", playPi' in svc and '"PAUSE", pausePi' in svc and '"EMERGENCY STOP", emergencyPi' in svc
          print('Scope/invariants: PASS')
          PY

      - name: Python syntax
        run: python -m py_compile mt5_bridge/bridge_v10_0.py

      - name: Install Flask for mocked Bridge regression
        run: python -m pip install --disable-pip-version-check -q Flask

      - name: Bridge regression tests
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util, sys, types
          from pathlib import Path

          class MT5(types.ModuleType):
              ACCOUNT_TRADE_MODE_DEMO=1; ACCOUNT_TRADE_MODE_REAL=2; ACCOUNT_TRADE_MODE_CONTEST=3
              POSITION_TYPE_BUY=0; POSITION_TYPE_SELL=1
              DEAL_ENTRY_IN=0; DEAL_ENTRY_OUT=1; DEAL_ENTRY_INOUT=2; DEAL_ENTRY_OUT_BY=3
              DEAL_TYPE_BUY=0; DEAL_TYPE_SELL=1
              ORDER_TYPE_BUY=0; ORDER_TYPE_SELL=1
              TRADE_RETCODE_DONE=10009; TRADE_RETCODE_DONE_PARTIAL=10010
              TRADE_ACTION_DEAL=1; TRADE_ACTION_SLTP=6
              ORDER_TIME_GTC=0; ORDER_FILLING_IOC=1; ORDER_FILLING_FOK=0; ORDER_FILLING_RETURN=2
              def __getattr__(self, name):
                  if name.startswith(('TIMEFRAME_','ORDER_','TRADE_','POSITION_','DEAL_','ACCOUNT_')): return 0
                  raise AttributeError(name)
          mt5=MT5('MetaTrader5'); mt5.initialize=lambda: True; mt5.last_error=lambda:(0,'ok')
          sys.modules['MetaTrader5']=mt5
          spec=importlib.util.spec_from_file_location('b','mt5_bridge/bridge_v10_0.py')
          b=importlib.util.module_from_spec(spec); spec.loader.exec_module(b)

          demo=types.SimpleNamespace(trade_mode=mt5.ACCOUNT_TRADE_MODE_DEMO)
          real=types.SimpleNamespace(trade_mode=mt5.ACCOUNT_TRADE_MODE_REAL)
          assert b.ALLOW_REAL is False
          assert b.trading_allowed(demo)[0] is True
          assert b.trading_allowed(real)[0] is False

          mt5.history_deals_get=lambda a,z: None; mt5.last_error=lambda:(500,'history unavailable')
          try: b.history_deals(30); raise AssertionError('history None accepted')
          except RuntimeError: pass
          mt5.history_deals_get=lambda a,z: ()
          assert b.history_deals(30) == ()

          b.ensure_mt5=lambda: True; b.trading_allowed=lambda a:(True,''); mt5.account_info=lambda:object()
          pos=types.SimpleNamespace(ticket=77, volume=.10)
          mt5.positions_get=lambda ticket=None, **kw:[pos]
          b.close_position_internal=lambda p, volume=None, comment=None:(True, {'ticket':77,'message':'done'})
          for payload in ({'ticket':77,'action':'close'},{'ticket':77,'action':'partial','pct':50}):
              with b.app.test_request_context('/position-action', method='POST', json=payload):
                  response,status=b.position_action_alias(); data=response.get_json()
                  assert status==200 and data['ok'] is True and data['message']=='done' and data['bridge_version']=='10.0'
          print('Bridge regression: PASS')
          PY

      - name: Full Android debug build
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify debug APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Commit only successfully built source fixes
        shell: bash
        run: |
          if git diff --quiet -- app/src/main/java/com/openai/fxm1/MonitoringService.java mt5_bridge/bridge_v10_0.py; then
            echo 'Source fixes already committed; recheck run.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/openai/fxm1/MonitoringService.java mt5_bridge/bridge_v10_0.py
          git commit -m 'V10 QA: fix history and emergency controls'
          git push origin HEAD:qa/v10-review-20260910

      - name: Upload QA APK evidence
        uses: actions/upload-artifact@v4
        with:
          name: FXM1-V10-QA-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
