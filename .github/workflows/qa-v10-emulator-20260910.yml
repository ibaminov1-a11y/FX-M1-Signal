name: QA V10 Android emulator 2026-09-10

on:
  push:
    branches:
      - qa/v10-review-20260910

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout committed QA sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build and exercise UI on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/qa-v10-emulator-20260910.sh

      - name: Upload emulator evidence files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FXM1-V10-emulator-evidence-${{ github.run_number }}
          path: |
            /tmp/fxm1-dialog.xml
            /tmp/shade.xml
            /tmp/fxm1-prefs-after-emergency.xml
          if-no-files-found: warn
