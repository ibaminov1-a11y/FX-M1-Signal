name: R74 entry HF1 delta acceptance
on:
  push:
    branches: [repair/r74-entry-hf1-20261020]
    paths: [.github/workflows/r74-entry-hf1.yml]
permissions:
  contents: read
  actions: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Flask==3.1.2 colorama==0.4.6
      - name: Observe actual old failures before applying patch
        env:
          PYTHONPATH: mt5_bridge:tests/event_core
          TERM: xterm
        run: |
          mkdir -p evidence
          python - <<'PY' > evidence/RED.log 2>&1
          import unittest,json
          from pathlib import Path
          r=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromName('test_r743_entry_hf1'))
          assert r.testsRun==8 and len(r.failures)==10 and not r.errors
          text='\n'.join(t for _,t in r.failures)
          for marker in ['BAR_ZERO_LEAKED_INTO_HISTORY','ROLLOVER_LOST_ENTRY','CACHED_LIVE_ROW_POISON','DIRECT_RESUMPTION_LOST_ADD','STALE_INTERRUPTION_REASON']:assert marker in text,marker
          Path('evidence/RED.json').write_text(json.dumps(dict(tests=8,failures=10,errors=0,expected=True)))
          PY
      - name: Apply narrow correction and run every current Python test
        env:
          PYTHONPATH: mt5_bridge:tests/event_core
          TERM: xterm
        run: |
          git apply --check .ci/r74-entry-hf1.patch
          git apply .ci/r74-entry-hf1.patch
          git diff --check
          python -m unittest discover -s tests/event_core -p 'test_*.py' -v > evidence/FULL.log 2>&1
          tail -12 evidence/FULL.log
          git diff > evidence/APPLIED.patch
          git rev-parse HEAD > evidence/SOURCE_SHA.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R74-ENTRY-HF1-REGRESSION
          path: evidence/
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    timeout-minutes: 9
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: R74-BULK-CLOCK-FULL
          run-id: 39379492320
          github-token: ${{ github.token }}
          path: original
      - name: Build replacement files from exact previous portable bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence,delta | Out-Null
          git apply --check .ci/r74-entry-hf1.patch
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          git apply .ci/r74-entry-hf1.patch
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          python -c "import zipfile;zipfile.ZipFile('original/FXM1_COMPLETE_GENERIC.zip').extractall('assembled')"
          python tools/r74_entry_hf1/build_delta.py --root assembled/FX-M1-Signal --source . --out delta --commit $env:GITHUB_SHA *> evidence/BUILD.log
          if ($LASTEXITCODE -ne 0) {Get-Content evidence/BUILD.log;exit $LASTEXITCODE}
      - name: Actual CMD after delta overlay, embedded Python and repair without rollback
        shell: pwsh
        run: |
          python tools/r74_entry_hf1/native_acceptance.py original/FXM1_COMPLETE_GENERIC.zip delta/FXM1_R74_ENTRY_HF1_PATCH.zip evidence/native *> evidence/NATIVE.log
          $rc=$LASTEXITCODE
          Get-Content evidence/NATIVE.log -Tail 35
          exit $rc
      - name: Record tested source, no personal state or credentials
        shell: pwsh
        run: |
          Copy-Item delta/PATCH_IDENTITY.json evidence/PATCH_IDENTITY.json
          git diff > evidence/APPLIED.patch
          git rev-parse HEAD > evidence/SOURCE_SHA.txt
          git archive --format=zip --output=evidence/SOURCE.zip HEAD
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: R74-ENTRY-HF1-PATCH
          path: delta/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R74-ENTRY-HF1-WINDOWS
          path: evidence/
          if-no-files-found: error
