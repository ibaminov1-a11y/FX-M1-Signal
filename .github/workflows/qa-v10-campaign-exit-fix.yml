name: QA V10 campaign exit fix

on:
  push:
    branches: [qa/v10-early-normal-entry]

permissions:
  contents: write

jobs:
  validate-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply NORMAL retest-entry and whole-campaign exit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('app/src/main/java/com/openai/fxm1/MonitoringService.java')
          s=p.read_text(encoding='utf-8')

          # 1) A raw momentum candle may contribute to quality, but must not by itself
          #    open the first NORMAL probe. Require pullback/retest timing.
          pat=r'''boolean preciseConfirmV10 = wantedV10 != 0 &&\s*\(timingV10 == wantedV10 \|\| swingTimingV10 == wantedV10 \|\| momentumV10 == wantedV10\);'''
          repl='''// V10.7: first NORMAL probe must be a retest/resume entry, not a raw momentum chase.\n        // Momentum still contributes to quality, but execution needs pullback timing or swing retest timing.\n        boolean preciseConfirmV10 = wantedV10 != 0 &&\n                (timingV10 == wantedV10 || swingTimingV10 == wantedV10);'''
          s,n=re.subn(pat,repl,s,count=1)
          if n!=1 and '(timingV10 == wantedV10 || swingTimingV10 == wantedV10);' not in s:
              raise SystemExit(f'preciseConfirm patch count={n}')

          # 2) On confirmed SWING/PEAK exit close the whole bot NORMAL campaign.
          #    Do not leave the newest red tranche behind while older green tranches close.
          selected_marker='String selected = currentSymbol().replace("/", "").toUpperCase(Locale.US);'
          sel=s.index(selected_marker)
          loop_start=s.index('for (int i=0; i<arr.length(); i++) {', sel)
          brace=s.index('{',loop_start)
          depth=0
          loop_end=None
          for i in range(brace,len(s)):
              if s[i]=='{': depth+=1
              elif s[i]=='}':
                  depth-=1
                  if depth==0:
                      loop_end=i+1
                      break
          if loop_end is None:
              raise SystemExit('cannot locate exit loop end')

          old_loop=s[loop_start:loop_end]
          if 'profit <= 0.0' in old_loop:
              new_loop='''ArrayList<JSONObject> campaign = new ArrayList<>();
                    double campaignPnl = 0.0;
                    for (int i=0; i<arr.length(); i++) {
                        JSONObject pos = arr.optJSONObject(i); if (pos == null) continue;
                        String sym = pos.optString("symbol", "").replace("/", "").toUpperCase(Locale.US);
                        String side = pos.optString("side", "").toUpperCase(Locale.US);
                        int magic = pos.optInt("magic", 0);
                        if (!sym.startsWith(selected) || !wantSide.equals(side) || magic != 720072) continue;
                        campaign.add(pos);
                        campaignPnl += pos.optDouble("profit", 0.0) + pos.optDouble("swap", 0.0);
                    }
                    for (JSONObject pos : campaign) {
                        JSONObject req = new JSONObject();
                        req.put("ticket", pos.optLong("ticket", 0));
                        req.put("action", "close");
                        JSONObject cr = FeatureEngine.httpJson("POST", base + "/position-action", req);
                        FeatureEngine.appendSignalHistory(p, currentSymbol(), currentTf(), "CLOSE", p.getInt("state_quality", -1),
                                cr.optBoolean("ok", false)
                                        ? "CAMPAIGN SWING/PEAK EXIT · basket before close " + String.format(Locale.US, "%+.2f", campaignPnl)
                                        : "CAMPAIGN EXIT ERROR: "+cr.optString("message",""));
                    }'''
              s=s[:loop_start]+new_loop+s[loop_end:]
          elif 'ArrayList<JSONObject> campaign' not in old_loop and 'ArrayList<JSONObject> campaign' not in s[sel:sel+5000]:
              raise SystemExit('unexpected campaign exit loop')

          p.write_text(s,encoding='utf-8')
          print('PATCHED')
          PY

      - name: Verify intended logic and safety
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/java/com/openai/fxm1/MonitoringService.java').read_text(encoding='utf-8')
          b=Path('mt5_bridge/bridge_v10_0.py').read_text(encoding='utf-8')
          f=Path('app/src/main/java/com/openai/fxm1/FeatureEngine.java').read_text(encoding='utf-8')
          assert '(timingV10 == wantedV10 || swingTimingV10 == wantedV10);' in s
          confirm=s[s.index('boolean preciseConfirmV10'):s.index('boolean strongSetupV10')]
          assert 'momentumV10 == wantedV10' not in confirm
          exit_block=s[s.index('int exitDir ='):s.index('long last = p.getLong("smart_snapshot_ms"')]
          assert 'magic != 720072' in exit_block
          assert 'ArrayList<JSONObject> campaign' in exit_block
          assert 'profit <= 0.0' not in exit_block
          assert 'CAMPAIGN SWING/PEAK EXIT' in exit_block
          assert 'payload.put("basket_no_average_down", true);' in s
          assert 'payload.put("basket_add_only_if_profitable", true);' in s
          assert 'maxPos = 10;' in s
          assert 'FXM1_ALLOW_REAL", "0"' in b
          assert 'NORMAL ADD WAIT: basket P/L' in b
          assert 'NORMAL ADD #' in b
          assert 'o.put("scalp_mode", false);' in f
          print('LOGIC / SAFETY INVARIANTS: PASS')
          PY

      - name: Android build
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Commit tested source change
        shell: bash
        run: |
          if git diff --quiet -- app/src/main/java/com/openai/fxm1/MonitoringService.java; then
            echo 'Source already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/openai/fxm1/MonitoringService.java
          git commit -m 'V10.7: require retest entry and close whole NORMAL campaign'
          git push origin HEAD:qa/v10-early-normal-entry

      - name: Upload candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: FXM1-V10.7-CAMPAIGN-QA
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
