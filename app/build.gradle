plugins { id 'com.android.application' }
android {
    namespace 'com.openai.fxm1'
    compileSdk 35
    defaultConfig {
        applicationId "com.openai.fxm1"
        minSdk 26
        targetSdk 35
        versionCode 916
        versionName "10.9-EC1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
